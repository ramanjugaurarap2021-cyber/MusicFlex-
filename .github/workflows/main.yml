name: Build MusicFlex APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir -p .musicflex-build
          unzip -q MusicFlex-Android-No-Startup.zip -d .musicflex-build

      - name: Locate Android project
        id: project
        run: |
          PROJECT_DIR=$(find .musicflex-build -type f -name "settings.gradle" -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            find .musicflex-build -maxdepth 6 -type f
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicFlex-debug-apk
          path: ${{ steps.project

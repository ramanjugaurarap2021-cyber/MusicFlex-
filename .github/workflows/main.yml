name: Build MusicFlex APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir -p .musicflex-build
          unzip -q MusicFlex-Android-No-Startup.zip -d .musicflex-build

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find .musicflex-build -type f -name settings.gradle -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Find APK
        run: |
          APK_PATH=$(find .musicflex-build -type f -name "app-debug.apk" -print -quit)

          if [ -z "$APK_PATH" ]; then
            echo "APK not found"
            find .musicflex-build -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK found: $APK_PATH"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicFlex-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
